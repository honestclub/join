<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Book a Discovery Call — Honest Club</title>
        <meta name="robots" content="noindex" />
        <meta
            http-equiv="refresh"
            content="0; url=https://cal.com/honest-club/discovery-call"
        />
        <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
        <link rel="apple-touch-icon" href="../favicon.svg" />
        <meta name="theme-color" content="#0f2419" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            @font-face {
                font-family: "Gooper";
                src:
                    url("../fonts/Gooper7-RegularItalic.woff2") format("woff2"),
                    url("../fonts/Gooper7-RegularItalic.woff") format("woff");
                font-weight: 400;
                font-style: italic;
                font-display: swap;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "DM Sans", -apple-system, sans-serif;
                background: #0f2419;
                color: #f5f1e8;
                line-height: 1.7;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 24px;
                -webkit-font-smoothing: antialiased;
            }

            .card {
                opacity: 0;
                animation: fadeIn 0.8s ease-out forwards;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .logo-text {
                font-family: "Gooper", Georgia, serif;
                font-size: 30px;
                font-weight: 400;
                font-style: italic;
                color: #e8d5a3;
                display: block;
                margin-bottom: 24px;
            }

            p {
                font-weight: 300;
                font-size: 17px;
                color: rgba(245, 241, 232, 0.8);
            }

            a {
                color: #e8d5a3;
                text-decoration: underline;
                text-underline-offset: 3px;
            }
        </style>
        <script>
            window.location.replace(
                "https://cal.com/honest-club/discovery-call",
            );
        </script>
    </head>
    <body>
        <div class="card">
            <span class="logo-text">honest club</span>
            <p>
                Taking you to book a discovery call&hellip;<br />
                If nothing happens,
                <a href="https://cal.com/honest-club/discovery-call"
                    >tap here</a
                >.
            </p>
        </div>
    </body>
</html>
