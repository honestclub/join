<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Page Not Found | Honest Club</title>
        <meta name="robots" content="noindex" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/favicon.png" />
        <meta name="theme-color" content="#0f2419" />
        <style>
            @font-face {
                font-family: "DM Sans";
                src: url("/fonts/DMSans-latin.woff2") format("woff2");
                font-weight: 300 600;
                font-style: normal;
                font-display: swap;
            }

            @font-face {
                font-family: "Gooper";
                src:
                    url("/fonts/Gooper7-RegularItalic.woff2") format("woff2"),
                    url("/fonts/Gooper7-RegularItalic.woff") format("woff");
                font-weight: 400;
                font-style: italic;
                font-display: swap;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "DM Sans", -apple-system, sans-serif;
                background: #0f2419;
                color: #f5f1e8;
                line-height: 1.7;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 24px;
                -webkit-font-smoothing: antialiased;
            }

            .card {
                max-width: 440px;
                opacity: 0;
                animation: fadeIn 0.8s ease-out forwards;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .logo-text {
                font-family: "Gooper", Georgia, serif;
                font-size: 30px;
                font-weight: 400;
                font-style: italic;
                color: #e8d5a3;
                display: block;
                margin-bottom: 24px;
            }

            h1 {
                font-size: 22px;
                font-weight: 500;
                margin-bottom: 12px;
            }

            p {
                font-weight: 300;
                font-size: 17px;
                color: rgba(245, 241, 232, 0.8);
                margin-bottom: 28px;
            }

            a {
                color: #e8d5a3;
                text-decoration: underline;
                text-underline-offset: 3px;
            }

            .btn {
                display: inline-block;
                padding: 14px 28px;
                background: #f5f1e8;
                color: #0f2419;
                border-radius: 999px;
                font-weight: 500;
                text-decoration: none;
            }

            .btn:hover {
                background: #e8d5a3;
            }

            .also {
                margin-top: 22px;
                margin-bottom: 0;
                font-size: 15px;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <a href="/" class="logo-text">honest club</a>
            <h1>That page is not here.</h1>
            <p>
                The link may be old, or the address has a typo. The honest
                thing to do is send you somewhere useful.
            </p>
            <a href="/" class="btn">Back to the homepage</a>
            <p class="also">
                Or <a href="https://cal.com/honest-club/discovery-call">book a free discovery call</a>.
            </p>
        </main>
    </body>
</html>
